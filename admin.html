<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ניהול הזמנות - שירים ושערים 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background-color: #f7f3eb; color: #1f2937; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6">

    <!-- Login -->
    <div id="login-view" class="max-w-sm mx-auto mt-16 bg-[#fffdfa] border-2 border-red-600 rounded-3xl p-6 space-y-4 shadow-sm">
        <h1 class="text-2xl font-black text-red-600 text-center">כניסת מנהל</h1>
        <input id="email" type="email" placeholder="אימייל" dir="ltr" class="w-full px-4 py-3 rounded-xl bg-[#f7f3eb] border border-gray-300 font-semibold focus:outline-none focus:border-red-600">
        <input id="password" type="password" placeholder="סיסמה" dir="ltr" class="w-full px-4 py-3 rounded-xl bg-[#f7f3eb] border border-gray-300 font-semibold focus:outline-none focus:border-red-600">
        <button onclick="login()" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3 rounded-xl">כניסה</button>
        <p id="login-error" class="text-red-600 text-sm font-bold text-center hidden"></p>
    </div>

    <!-- Dashboard -->
    <div id="admin-view" class="hidden max-w-5xl mx-auto space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
            <h1 class="text-2xl font-black text-red-600">הזמנות חולצות</h1>
            <div class="flex gap-2">
                <button onclick="exportCsv()" class="bg-[#fffdfa] border border-red-600 text-red-600 font-bold px-4 py-2 rounded-xl">ייצוא ל-CSV</button>
                <button onclick="loadOrders()" class="bg-[#fffdfa] border border-red-600 text-red-600 font-bold px-4 py-2 rounded-xl">רענון</button>
                <button onclick="logout()" class="bg-red-600 text-white font-bold px-4 py-2 rounded-xl">יציאה</button>
            </div>
        </div>

        <div id="auth-status" class="hidden"></div>

        <!-- Edit order modal -->
        <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">
            <div class="bg-[#fffdfa] border-2 border-red-600 rounded-3xl p-5 w-full max-w-sm space-y-3 shadow-lg">
                <h3 class="text-xl font-black text-red-600">עריכת הזמנה</h3>
                <label class="block text-sm font-black">שם מלא
                    <input id="edit-name" type="text" class="mt-1 w-full px-3 py-2.5 rounded-xl bg-[#f7f3eb] border border-gray-300 font-semibold focus:outline-none focus:border-red-600">
                </label>
                <label class="block text-sm font-black">מידה
                    <select id="edit-size" class="mt-1 w-full px-3 py-2.5 rounded-xl bg-[#f7f3eb] border border-gray-300 font-semibold"></select>
                </label>
                <label class="block text-sm font-black">סוג בד
                    <select id="edit-fabric" class="mt-1 w-full px-3 py-2.5 rounded-xl bg-[#f7f3eb] border border-gray-300 font-semibold"></select>
                </label>
                <label class="flex items-center gap-2 text-sm font-black">
                    <input id="edit-claimed" type="checkbox" class="accent-red-600 w-5 h-5">
                    <span>סומן "שולם" בטופס</span>
                </label>
                <label class="block text-sm font-black">הערות
                    <textarea id="edit-notes" rows="2" class="mt-1 w-full px-3 py-2.5 rounded-xl bg-[#f7f3eb] border border-gray-300 font-semibold focus:outline-none focus:border-red-600"></textarea>
                </label>
                <div class="flex gap-2 pt-1">
                    <button onclick="saveEdit()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-black py-2.5 rounded-xl">שמור</button>
                    <button onclick="closeEdit()" class="flex-1 bg-white border border-gray-300 text-gray-700 font-black py-2.5 rounded-xl">ביטול</button>
                </div>
            </div>
        </div>

        <div id="summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

        <div class="bg-[#fffdfa] border border-red-200 rounded-2xl shadow-sm overflow-x-auto">
            <table class="w-full text-right text-sm sm:text-base">
                <thead class="bg-red-50 text-red-700 font-black">
                    <tr>
                        <th class="p-3">#</th>
                        <th class="p-3">תאריך</th>
                        <th class="p-3">שם</th>
                        <th class="p-3">מידה</th>
                        <th class="p-3">בד</th>
                        <th class="p-3">סימן "שולם"</th>
                        <th class="p-3">אומת ב-PayBox</th>
                        <th class="p-3"></th>
                    </tr>
                </thead>
                <tbody id="orders-body" class="font-semibold"></tbody>
            </table>
        </div>

        <h2 class="text-xl font-black text-red-600 pt-4">מכיני עוגות/עוגיות</h2>
        <div id="bakers" class="bg-[#fffdfa] border border-red-200 rounded-2xl p-4 shadow-sm font-semibold"></div>
    </div>

    <script>
        // Same values as in index.html
        const SUPABASE_URL = 'https://pjujibzoscawmstarerz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5mK3Md5VCpXjHTSgVv68GQ_8kmPbg83';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let orders = [];

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        async function init() {
            const { data } = await db.auth.getSession();
            if (data.session) showAdmin();
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const err = document.getElementById('login-error');
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) { err.textContent = 'אימייל או סיסמה שגויים'; err.classList.remove('hidden'); return; }
            showAdmin();
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        function showAdmin() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            checkAdminStatus();
            loadOrders();
            loadBakers();
        }

        async function checkAdminStatus() {
            const el = document.getElementById('auth-status');
            const { data: sess } = await db.auth.getSession();
            const email = sess?.session?.user?.email || '';
            const { data: isAdmin, error } = await db.rpc('shirim3_is_admin');
            el.classList.remove('hidden');
            if (error) {
                el.className = 'rounded-xl p-3 text-sm font-bold bg-red-50 border border-red-300 text-red-700';
                el.textContent = 'לא ניתן לבדוק הרשאות מנהל: ' + error.message + ' (האם schema.sql הורץ?)';
            } else if (!isAdmin) {
                el.className = 'rounded-xl p-3 text-sm font-bold bg-red-50 border border-red-300 text-red-700';
                el.textContent = 'מחובר כ-' + email + ' אבל האימייל הזה לא ברשימת המנהלים (shirim3_admins), לכן אי אפשר לצפות, לערוך או למחוק.';
            } else {
                el.className = 'rounded-xl p-3 text-sm font-bold bg-green-50 border border-green-300 text-green-700';
                el.textContent = 'מחובר כמנהל: ' + email;
            }
        }

        async function loadOrders() {
            const { data, error } = await db.from('shirim3_shirt_orders').select('*').order('created_at', { ascending: false });
            if (error) { alert('שגיאה בטעינת ההזמנות: ' + error.message); return; }
            orders = data;
            renderOrders();
        }

        function renderOrders() {
            const verified = orders.filter(o => o.paid_verified).length;
            const claimedOnly = orders.filter(o => o.paid_claimed && !o.paid_verified).length;
            document.getElementById('summary').innerHTML = [
                ['סה"כ הזמנות', orders.length],
                ['אומתו ב-PayBox', verified],
                ['סומנו שולם, לא אומתו', claimedOnly],
                ['הכנסה מאומתת (₪)', verified * 30]
            ].map(([label, val]) => `
                <div class="bg-[#fffdfa] border border-red-200 rounded-2xl p-4 text-center shadow-sm">
                    <div class="text-2xl font-black text-red-600">${val}</div>
                    <div class="text-xs font-bold text-gray-600">${label}</div>
                </div>`).join('');

            document.getElementById('orders-body').innerHTML = orders.map((o, i) => `
                <tr class="border-t border-gray-200">
                    <td class="p-3">${orders.length - i}</td>
                    <td class="p-3 whitespace-nowrap">${new Date(o.created_at).toLocaleString('he-IL')}</td>
                    <td class="p-3">${esc(o.full_name)}</td>
                    <td class="p-3">${esc(o.size)}</td>
                    <td class="p-3">${esc(o.fabric)}</td>
                    <td class="p-3">${o.paid_claimed ? '✔' : '✘'}</td>
                    <td class="p-3 whitespace-nowrap">
                        <div class="inline-flex rounded-xl overflow-hidden border border-gray-300 text-sm font-black">
                            <button onclick="setVerified(${o.id}, true)" class="px-3 py-1.5 ${o.paid_verified ? 'bg-green-600 text-white' : 'bg-white text-gray-500 hover:bg-green-50'}">כן ✔</button>
                            <button onclick="setVerified(${o.id}, false)" class="px-3 py-1.5 border-r border-gray-300 ${!o.paid_verified ? 'bg-red-600 text-white' : 'bg-white text-gray-500 hover:bg-red-50'}">לא ✘</button>
                        </div>
                    </td>
                    <td class="p-3 whitespace-nowrap">
                        <button onclick="editOrder(${o.id})" class="text-gray-700 hover:text-red-600 font-bold ml-3">ערוך</button>
                        <button onclick="removeOrder(${o.id})" class="text-red-600 hover:text-red-700 font-bold">מחק</button>
                    </td>
                </tr>`).join('') || '<tr><td colspan="8" class="p-6 text-center text-gray-400">אין הזמנות עדיין</td></tr>';
        }

        async function setVerified(id, value) {
            const current = orders.find(o => o.id === id);
            if (current && current.paid_verified === value) return;
            const { error } = await db.from('shirim3_shirt_orders').update({ paid_verified: value }).eq('id', id);
            if (error) alert('שגיאה בעדכון: ' + error.message);
            loadOrders();
        }

        async function removeOrder(id) {
            if (!confirm('למחוק את ההזמנה?')) return;
            const { error } = await db.from('shirim3_shirt_orders').delete().eq('id', id);
            if (error) alert('שגיאה במחיקה: ' + error.message);
            loadOrders();
        }

        const SIZES = ['XXXL', 'XXL', 'XL', 'L', 'M', 'S', '18', '16', '14', '12', '10', '8', '6', '4'];
        const FABRICS = ['דרייפיט', 'טריקו'];
        let editingId = null;

        function editOrder(id) {
            const o = orders.find(x => x.id === id);
            if (!o) return;
            editingId = id;
            document.getElementById('edit-name').value = o.full_name;
            document.getElementById('edit-size').innerHTML = SIZES.map(s => `<option value="${s}" ${s === o.size ? 'selected' : ''}>${s}</option>`).join('');
            document.getElementById('edit-fabric').innerHTML = FABRICS.map(f => `<option value="${f}" ${f === o.fabric ? 'selected' : ''}>${f}</option>`).join('');
            document.getElementById('edit-claimed').checked = !!o.paid_claimed;
            document.getElementById('edit-notes').value = o.notes || '';
            const modal = document.getElementById('edit-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEdit() {
            const modal = document.getElementById('edit-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            editingId = null;
        }

        async function saveEdit() {
            const full_name = document.getElementById('edit-name').value.trim();
            if (full_name.length < 2) { alert('יש להזין שם מלא'); return; }
            const update = {
                full_name,
                size: document.getElementById('edit-size').value,
                fabric: document.getElementById('edit-fabric').value,
                paid_claimed: document.getElementById('edit-claimed').checked,
                notes: document.getElementById('edit-notes').value.trim() || null
            };
            const { data, error } = await db.from('shirim3_shirt_orders').update(update).eq('id', editingId).select();
            if (error) { alert('שגיאה בעדכון: ' + error.message); return; }
            if (!data || data.length === 0) { alert('העדכון לא נשמר. בדקו את הרשאות המנהל.'); return; }
            closeEdit();
            loadOrders();
        }

        let bakersList = [];

        async function loadBakers() {
            const { data, error } = await db.from('shirim3_cake_bakers').select('id, name').order('id');
            if (error) { alert('שגיאה בטעינת מכיני העוגות: ' + error.message); return; }
            bakersList = data || [];
            document.getElementById('bakers').innerHTML = bakersList.length
                ? bakersList.map((b, i) => `
                    <div class="flex items-center justify-between gap-2 py-2 border-b border-gray-100 last:border-0">
                        <span>${i + 1}. ${esc(b.name)}</span>
                        <span class="flex gap-3 shrink-0 text-sm font-bold">
                            <button onclick="renameBaker(${b.id})" class="text-gray-700 hover:text-red-600">ערוך</button>
                            <button onclick="removeBaker(${b.id})" class="text-red-600 hover:text-red-700">מחק</button>
                        </span>
                    </div>`).join('') + `<div class="pt-2 text-gray-500">${bakersList.length} / 20</div>`
                : 'אין נרשמים עדיין';
        }

        async function renameBaker(id) {
            const baker = bakersList.find(b => b.id === id);
            if (!baker) return;
            const input = prompt('שם חדש:', baker.name);
            if (input === null) return;
            const name = input.trim();
            if (name.length < 2 || name === baker.name) return;
            const { data, error } = await db.from('shirim3_cake_bakers').update({ name }).eq('id', id).select();
            if (error) { alert('שגיאה בעדכון: ' + error.message); return; }
            if (!data || data.length === 0) alert('העדכון לא נשמר. ייתכן שחסרה הרשאת עדכון במסד הנתונים (ראו schema.sql).');
            loadBakers();
        }

        async function removeBaker(id) {
            const baker = bakersList.find(b => b.id === id);
            if (!baker || !confirm(`למחוק את "${baker.name}" מרשימת המכינים?`)) return;
            const { data, error } = await db.from('shirim3_cake_bakers').delete().eq('id', id).select();
            if (error) { alert('שגיאה במחיקה: ' + error.message); return; }
            if (!data || data.length === 0) alert('המחיקה לא בוצעה. בדקו את הרשאות המסד.');
            loadBakers();
        }

        function exportCsv() {
            const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            const rows = [['תאריך', 'שם', 'מידה', 'בד', 'סימן שולם', 'אומת PayBox']]
                .concat(orders.map(o => [o.created_at, o.full_name, o.size, o.fabric, o.paid_claimed, o.paid_verified]));
            const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
            a.download = 'shirt-orders.csv';
            a.click();
        }

        init();
    </script>
</body>
</html>
